Syntax 4

# Use case configuration for Xiaomi Redmi K40 / POCO F3 (alioth)
# Speakers: MultiMedia1 -> TERT_MI2S_RX (main TLMM mi2s2 pins) -> cs35l41 x2

Comment "Xiaomi alioth speakers"

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8250/Xiaomi-Alioth-HiFi.conf"
	Comment "Speakers"
}

BootSequence [
	# 816 = 0 dB digital (see the note in Xiaomi-Alioth-HiFi.conf).
	cset "name='RCV Digital PCM Volume' 816"
	cset "name='LCV Digital PCM Volume' 816"
	cset "name='RCV DSP1 Preload Switch' 1"
	cset "name='LCV DSP1 Preload Switch' 1"
	cset "name='RCV HW Noise Gate Enable' 0"
	cset "name='LCV HW Noise Gate Enable' 0"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
