# HiFi verb for Xiaomi alioth speakers
#   MultiMedia1 -> QUAT_MI2S_RX -> cs35l41 RCV/LCV (hw:${CardId},0)

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RCV DSP RX1 Source' 'ASPRX1'"
		cset "name='LCV DSP RX1 Source' 'ASPRX1'"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	EnableSequence [
		cset "name='RCV Digital PCM Volume' 20"
		cset "name='LCV Digital PCM Volume' 20"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}